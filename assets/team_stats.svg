<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <style>
    .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #c9d1d9; }
    .stat-bold { font-weight: 600; fill: #ffffff; }
    .circle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #58a6ff; }
    .circle-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #8b949e; letter-spacing: 1px; }
  </style>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="494" height="194" rx="8" fill="#0d1117" stroke="#30363d"/>

  <!-- Title -->
  <text x="25" y="34" class="header">equipment_rental 's Team Dashboard</text>

  <!-- Content Rows -->
  <g transform="translate(25, 48)">
    <!-- Row 1: Team Lead -->
    <g transform="translate(0, 16)">
      <text x="0" y="0" font-size="13">👑</text>
      <text x="22" y="0" class="stat-label"><tspan class="stat-bold">Team Lead:</tspan> Architecture &amp; UI (main, develop)</text>
    </g>

    <!-- Row 2: Pair 1 -->
    <g transform="translate(0, 39)">
      <text x="0" y="0" font-size="13">🛠️</text>
      <text x="22" y="0" class="stat-label"><tspan class="stat-bold">Пара 1:</tspan> Оборудование (feature/equipment)</text>
    </g>

    <!-- Row 3: Pair 2 -->
    <g transform="translate(0, 62)">
      <text x="0" y="0" font-size="13">👤</text>
      <text x="22" y="0" class="stat-label"><tspan class="stat-bold">Пара 2:</tspan> Клиенты (feature/clients)</text>
    </g>

    <!-- Row 4: Pair 3 -->
    <g transform="translate(0, 85)">
      <text x="0" y="0" font-size="13">📅</text>
      <text x="22" y="0" class="stat-label"><tspan class="stat-bold">Пара 3:</tspan> Аренды (feature/rentals)</text>
    </g>

    <!-- Row 5: Pair 4 -->
    <g transform="translate(0, 108)">
      <text x="0" y="0" font-size="13">👔</text>
      <text x="22" y="0" class="stat-label"><tspan class="stat-bold">Пара 4:</tspan> Сотрудники (feature/employers)</text>
    </g>
  </g>

  <!-- Circular Gauge (Right Side) -->
  <g transform="translate(420, 108)">
    <circle r="40" fill="none" stroke="#21262d" stroke-width="6"/>
    <circle r="40" fill="none" stroke="#388bfd" stroke-width="6" stroke-dasharray="251" stroke-dashoffset="50" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="4" text-anchor="middle" class="circle-text">4P</text>
    <text x="0" y="20" text-anchor="middle" class="circle-sub">8 DEVS</text>
  </g>
</svg>
